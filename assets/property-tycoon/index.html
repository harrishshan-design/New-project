<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08110f">
  <meta name="description" content="Build a virtual Malaysian property portfolio, learn investing concepts and discover real RealityGenius listings.">
  <title>RealityGenius Property Tycoon</title>
  <script>
    window.RG_TYCOON_BASE = /^\/(tycoon|property-tycoon)\/?$/.test(location.pathname)
      ? "/assets/property-tycoon/"
      : "./";
    const gameStyles = document.createElement("link");
    gameStyles.rel = "stylesheet";
    gameStyles.href = window.RG_TYCOON_BASE + "assets/styles.css";
    document.head.appendChild(gameStyles);
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="dev" class="dev-overlay" aria-hidden="true"></div>
  <script>
    const gameScript = document.createElement("script");
    gameScript.type = "module";
    gameScript.src = window.RG_TYCOON_BASE + "assets/game.js";
    document.body.appendChild(gameScript);
  </script>
</body>
</html>
